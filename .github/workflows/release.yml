name: Release

# Releases are cut automatically from Conventional Commits on main by
# semantic-release: feat -> minor, fix/perf -> patch, a BREAKING CHANGE footer
# -> major; other types release nothing. There is no manual approval step. The
# gates are branch protection (PR + code-owner review + required checks), the
# verify job below, and the tag ruleset. The default GITHUB_TOKEN cannot bypass
# a ruleset, so the tag push uses a short-lived token minted from a dedicated
# GitHub App (Contents: write, this repo only) that is the tag ruleset's only
# bypass actor. Its credentials live in the `release` environment, which is
# restricted to `main` and has no required reviewers. The package.json version in git is a placeholder: semantic-release
# stamps the real version into the packed tarball, never into a commit. The
# GitHub release is published last so that GitHub's immutable-releases setting
# locks the tag and every asset the moment it goes public.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools (mise.toml)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
          cache: false

      - name: Test
        run: mise run test

      - name: Block machine-specific or private content
        run: bash scripts/check-private-content.sh

      - name: Verify the published tarball contents
        run: bash scripts/check-package-contents.sh

  release:
    name: release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds the release App credentials; restricted to main, no approval step.
    environment: release
    permissions:
      contents: write       # push the tag, create the release
      packages: write       # publish to GitHub Packages
      id-token: write       # build provenance attestation
      attestations: write   # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned tools (mise.toml)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
          cache: false

      # Locked, script-free install of the release tooling only.
      - name: Install release tooling
        run: mise exec -- npm ci --ignore-scripts

      # Short-lived (<= 1h) installation token scoped to this repository with
      # Contents: write only. Needed because the ruleset that protects tags
      # cannot be bypassed by the default GITHUB_TOKEN.
      - name: Create release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # Tags the commit and creates a DRAFT release with the tarball attached.
      # Does nothing when no commit since the last tag is releasable.
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: mise exec -- npx --no-install semantic-release

      - name: Detect a new release
        id: detect
        run: |
          shopt -s nullglob
          tarballs=(dist/*.tgz)
          if [[ ${#tarballs[@]} -eq 0 ]]; then
            echo "No releasable commits; nothing to publish."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          {
            echo "released=true"
            echo "tarball=${tarballs[0]}"
            echo "version=$(jq -r .version package.json)"
            echo "name=$(jq -r .name package.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: steps.detect.outputs.released == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.detect.outputs.tarball }}

      - name: Publish to GitHub Packages (skipped if this version already exists)
        if: steps.detect.outputs.released == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ steps.detect.outputs.name }}
          VERSION: ${{ steps.detect.outputs.version }}
          TARBALL: ${{ steps.detect.outputs.tarball }}
        run: |
          registry="https://npm.pkg.github.com"
          cat > "$RUNNER_TEMP/.npmrc" <<'NPMRC'
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          if mise exec -- npm view "$PACKAGE_NAME@$VERSION" version --registry "$registry" --userconfig "$RUNNER_TEMP/.npmrc" >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already published; leaving it untouched."
            exit 0
          fi
          # The leading ./ matters: without it npm reads "dist/<file>.tgz" as the
          # GitHub shorthand owner/repo and tries to clone it over SSH.
          mise exec -- npm publish "./$TARBALL" --registry "$registry" --userconfig "$RUNNER_TEMP/.npmrc"

      # Publishing the release is the last step. With immutable releases
      # enabled this locks the tag and all assets permanently.
      - name: Publish the release
        if: steps.detect.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.detect.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
